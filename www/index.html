<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Décodeur Code Gray VA1..VA11</title>
<style>
:root{--bg:#121417;--card:#1d2127;--tx:#e8eaed;--mut:#8a939e;--on:#e67e22;--ok:#2ecc71}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:10px;max-width:900px}
.card{background:var(--card);border-radius:12px;padding:10px;margin-bottom:10px}
canvas{width:100%;background:#000;border-radius:8px;display:block;touch-action:manipulation}
button,label.b{background:#2d6cdf;color:#fff;border:0;border-radius:8px;padding:11px 14px;font-weight:600;font-size:14px;cursor:pointer;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
#dec{font-size:46px;font-weight:800;color:var(--ok);text-align:center}
#info{font:13px Consolas,monospace;color:var(--mut);text-align:center;margin-top:4px;word-break:break-all}
#vas{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-top:8px}
#vas div{background:#34495e;border-radius:6px;text-align:center;padding:9px 0;font-size:11px;font-weight:700;cursor:pointer;user-select:none;line-height:1.3}
#vas div.on{background:var(--on)}#vas div.f{outline:3px solid #3498db}
#vas div.f::after{content:'manuel';display:block;font-size:9px;color:#9fd3ff}
small{color:var(--mut)}
</style></head><body>
<div class="card">
 <div class="row">
  <button id="bcam">Démarrer la caméra</button>
  <label class="b">Charger une photo<input id="file" type="file" accept="image/*" hidden></label>
  <button id="bswap" style="background:#555">Changer de caméra</button>
 </div>
 <div class="row" style="margin-top:8px">
  <button id="bfreeze" style="background:#555">Figer l'image</button>
  <button id="breset" style="background:#555">Tout remettre en auto</button>
 </div>
 <small>Détection automatique. En cas d'erreur, touchez une LED sur l'image ou un bouton VA pour inverser son état ; touchez-la encore pour revenir en automatique.</small>
</div>
<div class="card"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="card">
 <div id="dec">--</div>
 <div id="info"></div>
 <div id="vas"></div>
</div>
<script>
const N=11, cv=document.getElementById('cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
const sm=document.createElement('canvas'), sctx=sm.getContext('2d',{willReadFrequently:true});
const vid=document.createElement('video'); vid.playsInline=true; vid.muted=true;
let frozen=false, snap=document.createElement('canvas'), curBits=Array(N).fill(0), src=null, stream=null, facing='environment', forced=Array(N).fill(null), hist=[], fc=0;
// Géométrie (fractions de l'image) : x0 = début, st = pas entre LEDs, y = ligne des LEDs
const G={x0:.04,st:.92/N,y:.12,found:0,bar:false};
const vas=document.getElementById('vas');
function toggle(i){forced[i]=forced[i]!==null?null:1-curBits[i]}
for(let i=0;i<N;i++){const d=document.createElement('div');d.onclick=()=>toggle(i);vas.appendChild(d)}
document.getElementById('breset').onclick=()=>{forced=Array(N).fill(null)};
document.getElementById('bfreeze').onclick=e=>{
 if(!frozen){if(!src)return;snap.width=cv.width;snap.height=cv.height;snap.getContext('2d').drawImage(src,0,0,cv.width,cv.height);frozen=true;e.target.textContent="Reprendre l'image en direct"}
 else{frozen=false;e.target.textContent="Figer l'image"}
};

async function startCam(){
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  vid.srcObject=stream;await vid.play();src=vid;document.getElementById('bcam').textContent='Caméra active';
 }catch(e){alert("Caméra inaccessible : "+e.message+"\n(Utilisez http://localhost ou https, et autorisez la caméra.)")}
}
document.getElementById('bcam').onclick=startCam;
document.getElementById('bswap').onclick=()=>{facing=facing==='environment'?'user':'environment';if(stream)startCam()};
document.getElementById('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}src=im};im.src=URL.createObjectURL(f);
};
cv.onclick=e=>{
 const r=cv.getBoundingClientRect(),i=Math.floor(((e.clientX-r.left)/r.width-G.x0)/G.st);
 if(i>=0&&i<N)toggle(i);
};

function rgb2hsv(r,g,b){ // h en degrés, s et v sur 0..255
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
 if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
 return [h,mx?d/mx*255:0,mx];
}
// ---- Détection automatique de la géométrie ----
function detectGeometry(){
 const w=sm.width,h=sm.height,d=sctx.getImageData(0,0,w,h).data;
 // 1) bande orange des porte-étiquettes (55%-85% de la hauteur) -> étendue horizontale
 const col=new Int32Array(w),y0=Math.floor(h*.55),y1=Math.floor(h*.85);
 for(let y=y0;y<y1;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,[H,S,V]=rgb2hsv(d[i],d[i+1],d[i+2]);
  if(H>=10&&H<=56&&S>=130&&V>=130)col[x]++}
 let a=-1,b=-1,cnt=0;for(let x=0;x<w;x++)if(col[x]>h*.02){if(a<0)a=x;b=x;cnt++}
 let tx0=.04,tx1=.96;G.bar=false;
 if(a>=0&&cnt>w*.4){tx0=a/w;tx1=b/w;G.bar=true}
 let tst=(tx1-tx0)/N,ty=G.y;
 // 2) LEDs allumées : taches jaune-orangé lumineuses dans le tiers supérieur
 const th=Math.floor(h*.35),m=new Uint8Array(w*th);
 for(let y=0;y<th;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,[H,S,V]=rgb2hsv(d[i],d[i+1],d[i+2]);
  if(H>=24&&H<=84&&S>=90&&V>=140)m[y*w+x]=1}
 const blobs=[],stack=[];
 for(let p=0;p<m.length;p++)if(m[p]===1){
  let area=0,sx=0,sy=0;stack.push(p);m[p]=2;
  while(stack.length){const q=stack.pop(),qx=q%w,qy=(q-qx)/w;area++;sx+=qx;sy+=qy;
   for(const nq of [q-1,q+1,q-w,q+w]){if(nq<0||nq>=m.length)continue;if((nq===q-1&&qx===0)||(nq===q+1&&qx===w-1))continue;
    if(m[nq]===1){m[nq]=2;stack.push(nq)}}}
  const fa=area/(w*h);if(fa>.00015&&fa<.02)blobs.push([sx/area/w,sy/area/h]);
 }
 G.found=blobs.length;
 let tx=tx0;
 if(blobs.length){
  ty=blobs.map(b=>b[1]).sort((u,v)=>u-v)[blobs.length>>1];
  // 3) affinage de la grille sur les LEDs allumées (régression linéaire index -> x)
  const pts=blobs.filter(b=>Math.abs(b[1]-ty)<.06).map(b=>[Math.round((b[0]-tx0)/tst-.5),b[0]]).filter(p=>p[0]>=0&&p[0]<N);
  const idx=new Set(pts.map(p=>p[0]));
  if(idx.size>=3){
   const n=pts.length,mi=pts.reduce((s,p)=>s+p[0],0)/n,mx=pts.reduce((s,p)=>s+p[1],0)/n;
   let nu=0,de=0;pts.forEach(p=>{nu+=(p[0]-mi)*(p[1]-mx);de+=(p[0]-mi)**2});
   if(de>0){const st=nu/de;if(Math.abs(st-tst)<tst*.2){tst=st;tx0=mx-(mi+.5)*st}}
  }else if(pts.length){const r=pts.map(p=>p[1]-(tx0+(p[0]+.5)*tst)).sort((u,v)=>u-v)[pts.length>>1];tx0+=r}
  tx=tx0;
 }
 const k=fc<=3?1:.3; // lissage temporel
 G.x0+=(tx-G.x0)*k;G.st+=(tst-G.st)*k;
 if(blobs.length)G.y+=(ty-G.y)*k;
}
// ---- Score de luminosité d'une LED ----
function score(x,y,r){
 const x1=Math.max(0,Math.round(x-r)),y1=Math.max(0,Math.round(y-r)),w=Math.min(cv.width-x1,Math.round(2*r)),h=Math.min(cv.height-y1,Math.round(2*r));
 if(w<=0||h<=0)return 0;
 const d=ctx.getImageData(x1,y1,w,h).data,V=[],S=[];let tr=0,tb=0,n=0;
 for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);V.push(mx);S.push(mx?(mx-mn)/mx*255:0)}
 const p=a=>{a.sort((u,v)=>u-v);return a[Math.floor(a.length*.85)]};
 const v=p(V),s=p(S);
 for(let i=0;i<d.length;i+=4)if(Math.max(d[i],d[i+1],d[i+2])>=v){tr+=d[i];tb+=d[i+2];n++}
 return v*.6+s*.4+(n?Math.max(0,Math.min(1,(tr-tb)/n/120)):0)*20;
}
// ---- Seuil automatique : coupure au plus grand écart entre les scores ----
function autoBits(sc){
 const s=[...sc].sort((a,b)=>a-b);
 if(s[N-1]<150)return [sc.map(()=>0),150];
 let gi=0,gm=0;for(let i=0;i<N-1;i++)if(s[i+1]-s[i]>gm){gm=s[i+1]-s[i];gi=i}
 if(gm>=28){const t=(s[gi]+s[gi+1])/2;return [sc.map(v=>v>t?1:0),t]}
 return s[0]>185?[sc.map(()=>1),185]:[sc.map(()=>0),185]; // toutes pareilles : tout allumé ou tout éteint
}
function grayToDec(bits){ // VA1 = bit de poids faible
 const g=bits.reduce((a,b,i)=>a+(b<<i),0);let bin=g,m=g>>1;while(m){bin^=m;m>>=1}return bin;
}
function frame(){
 requestAnimationFrame(frame);
 if(!src){ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#888';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('Démarrez la caméra ou chargez une photo',cv.width/2,cv.height/2);return}
 const view=frozen?snap:src,sw=view.videoWidth||view.naturalWidth||view.width,sh=view.videoHeight||view.naturalHeight||view.height;if(!sw)return;
 if(cv.height!==Math.round(960*sh/sw))cv.height=Math.round(960*sh/sw);
 ctx.drawImage(view,0,0,cv.width,cv.height);
 fc++;
 if(fc%3===1){sm.width=400;sm.height=Math.round(400*cv.height/cv.width);sctx.drawImage(cv,0,0,sm.width,sm.height);detectGeometry()}
 const W=cv.width,H=cv.height,step=G.st*W,cy=G.y*H,r=Math.max(6,step*.28),sc=[];
 for(let i=0;i<N;i++)sc.push(score(G.x0*W+(i+.5)*step,cy,r));
 hist.push(sc);if(hist.length>4)hist.shift();
 const avg=sc.map((_,i)=>hist.reduce((a,h)=>a+h[i],0)/hist.length);
 const [auto,thr]=autoBits(avg);
 const bits=auto.map((b,i)=>forced[i]===null?b:forced[i]);curBits=bits;
 for(let i=0;i<N;i++){
  const cx=G.x0*W+(i+.5)*step;ctx.lineWidth=bits[i]?4:2;ctx.strokeStyle=forced[i]!==null?'#3aa0ff':bits[i]?'#00ff66':'#c8c8c8';
  ctx.beginPath();ctx.arc(cx,cy,bits[i]?r+5:r*.8,0,7);ctx.stroke();
  ctx.fillStyle=forced[i]!==null?'#1d5fa8':bits[i]?'#00aa44':'#333a';ctx.fillRect(cx-22,cy+r+10,44,20);
  ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('VA'+(i+1),cx,cy+r+25);
 }
 const dec=grayToDec(bits);
 document.getElementById('dec').textContent='Position : '+dec;
 document.getElementById('info').innerHTML=`Mot Gray (VA11→VA1) : ${[...bits].reverse().join('')}<br>Binaire naturel : ${dec.toString(2).padStart(N,'0')}<br>`+
  `Bornier : ${G.bar?'bande orange repérée':'bande non repérée (cadre par défaut)'} · LEDs allumées vues : ${G.found}`;
 [...vas.children].forEach((d,i)=>{d.className=(bits[i]?'on ':'')+(forced[i]!==null?'f':'');d.innerHTML='VA'+(i+1)+'<br>'+bits[i]});
}
frame();
</script></body></html>
